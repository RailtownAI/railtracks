name: Feature Request
description: Suggest a new feature or improvement for railtracks.

body:
  - type: markdown
    attributes:
      value: |
        Feature requests should be **concrete**: a specific behavior you want, tied to a real use case.

        - Open-ended ideas or "have you thought about X" belong in [Discussions](https://github.com/RailtownAI/railtracks/discussions).
        - Bugs in existing behavior belong in the **Bug Report** template.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Prechecks
      options:
        - label: I have [searched existing issues](https://github.com/RailtownAI/railtracks/issues?q=is%3Aissue) and Discussions and this is not a duplicate.
          required: true
        - label: This is a concrete feature request with a real use case, not an open-ended idea.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which subsystem is this feature for? Pick the closest match.
      options:
        - Agents / Nodes
        - Tools
        - LLM Providers
        - Middleware
        - Guardrails
        - RAG / Retrieval
        - Prebuilt Add-ons
        - Human-in-the-loop
        - Observability / Visualizer
        - MCP Integration
        - Evaluations
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: 'What are you trying to do that railtracks doesn''t support today? Include the concrete use case. Not "it would be nice if...", but "I''m building X and I can''t do Y."'
      placeholder: |
        I'm building a multi-agent workflow where guardrails need to short-circuit a tool call based on the LLM's decision. Today guardrails only run around the model call, so I can't intercept between the LLM's tool-call proposal and the actual tool invocation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? An API sketch, a reference to how another framework does it, or the shape of the behavior is fine.
      placeholder: |
        Add a `@rt.tool_guard` decorator that runs between the LLM's tool_call decision and the tool invocation:

        ```python
        @rt.tool_guard
        def block_writes(event) -> Decision:
            if event.tool.name.startswith("write_"):
                return Decision.block(reason="writes require confirmation")
            return Decision.pass_()

        Agent = rt.agent_node(..., model_middleware=[block_writes])
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other ways railtracks could solve this.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this if a maintainer confirms the approach.
