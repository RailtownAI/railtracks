name: Feature Request
description: Suggest a new feature or improvement for railtracks.

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that railtracks doesn't support today? Include enough context that we can understand the use case.
      placeholder: |
        I'm building X and I need to Y, but railtracks currently only lets me Z.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: What would you like to see? A specific API sketch, a link to how another framework does it, or just the shape of the behavior is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other ways railtracks could solve this. Helps us understand the design space.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this if a maintainer confirms the approach.
