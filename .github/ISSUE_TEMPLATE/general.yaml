name: "Question or Idea"
description: "Open-ended questions and ideas. For bugs use Bug Report; for concrete features use Feature Request."

body:
  - type: textarea
    id: description
    attributes:
      label: What's on your mind?
      description: >
        Questions, ideas, API design thoughts, feedback. If you have a concrete bug or feature request, use one of those templates instead.
      placeholder: How do I configure railtracks to work offline?
    validations:
      required: true
