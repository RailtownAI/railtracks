name: "[Maintainer Only] Feature Spec"
description: "A contained set of user-facing requirements. Railtracks maintainers/team members only."
labels: ["[Maintainer] feature"]
body:
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What will the user be able to do once this is done? Bulleted list of specific requirements.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: API shape, key decisions, links to design docs or prior discussion.

  - type: textarea
    id: sub_issues
    attributes:
      label: Sub-issues (if this spans multiple PRs)
      description: |
        If this is one PR's worth of work, leave blank. If it needs multiple sub-issues, list them here as `- [ ] #123` — and consider using the Epic template instead.
