name: "[Maintainer Only] Feature Spec"
description: "A contained set of user-facing requirements. Railtracks maintainers/team members only."
labels: ["[Maintainer] feature"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Agents / Nodes
        - Tools
        - LLM Providers
        - Middleware
        - Guardrails
        - RAG / Retrieval
        - Prebuilt Add-ons
        - Human-in-the-loop
        - Observability / Visualizer
        - MCP Integration
        - Evaluations
        - Cross-cutting / Multiple
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What will the user be able to do once this is done? Bulleted list of specific requirements.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: API shape, key decisions, links to design docs or prior discussion.

  - type: markdown
    attributes:
      value: |
        If this needs multiple PRs, use the **Epic** template instead and link sub-issues via GitHub's Sub-issues panel.
