# Attachment formats, checked in order. A row's bytes match when, at each byte offset
# in `match`, the content holds that string or one of that list. Strings are read as
# latin-1, so `\x` escapes give exact bytes. Rows without `match` are named by extension only.
# `extensions` map a file name to the same MIME type its bytes produce, overriding
# Python's `mimetypes`.
# `container` lists the top-level types (`audio`) or exact MIME types (`image/avif`) a format
# can hold. A file name naming one of them decides it, so an Ogg file named .ogv is video
# and a HEIF named .avif is AVIF.
formats:
  - mime_type: "image/png"
    match: {0: "\x89PNG\r\n\x1a\n"}
    extensions: [".png"]
  - mime_type: "image/jpeg"
    match: {0: "\xff\xd8\xff"}
    extensions: [".jpg", ".jpeg", ".jpe"]
  - mime_type: "image/gif"
    match: {0: ["GIF87a", "GIF89a"]}
    extensions: [".gif"]
  - mime_type: "image/x-icon"
    match: {0: "\0\0\x01\0"}
    extensions: [".ico"]
  - mime_type: "application/pdf"
    match: {0: "%PDF"}
    extensions: [".pdf"]
  - mime_type: "audio/ogg"
    match: {0: "OggS"}
    extensions: [".ogg", ".oga"]
    container: [audio, video]
  - mime_type: "audio/flac"
    match: {0: "fLaC"}
    extensions: [".flac"]
  # EBML header, shared with Matroska; its DocType tells them apart in code.
  - mime_type: "video/webm"
    match: {0: "\x1a\x45\xdf\xa3"}
    extensions: [".webm"]
    container: [audio, video]
  # ID3v2 major version, so text starting "ID3" is not audio.
  - mime_type: "audio/mpeg"
    match: {0: "ID3", 3: ["\x02", "\x03", "\x04"]}
    extensions: [".mp3"]
  # Reserved header fields, always zero.
  - mime_type: "image/bmp"
    match: {0: "BM", 6: "\0\0\0\0"}
    extensions: [".bmp"]
  # ISO-BMFF: 4-byte box size, then "ftyp", then the major brand.
  - mime_type: "image/avif"
    match: {4: "ftyp", 8: ["avif", "avis"]}
    extensions: [".avif"]
  - mime_type: "image/heic"
    match: {4: "ftyp", 8: ["heic", "heix", "hevc", "hevx"]}
    extensions: [".heic"]
  # Generic HEIF brands, also used by some AVIF and HEIC files.
  - mime_type: "image/heif"
    match: {4: "ftyp", 8: ["mif1", "msf1"]}
    extensions: [".heif"]
    container: [image/avif, image/heic]
  - mime_type: "audio/mp4"
    match: {4: "ftyp", 8: "M4A "}
    extensions: [".m4a"]
  - mime_type: "video/quicktime"
    match: {4: "ftyp", 8: "qt  "}
    extensions: [".mov"]
  - mime_type: "video/mp4"
    match: {4: "ftyp", 8: ["isom", "iso2", "iso4", "iso5", "iso6", "mp41", "mp42", "avc1", "dash", "M4V "]}
    extensions: [".mp4", ".m4v"]
    container: [audio, video]
  - mime_type: "image/webp"
    match: {0: "RIFF", 8: "WEBP"}
    extensions: [".webp"]
  - mime_type: "audio/wav"
    match: {0: "RIFF", 8: "WAVE"}
    extensions: [".wav"]
  - mime_type: "video/x-msvideo"
    match: {0: "RIFF", 8: "AVI "}
    extensions: [".avi"]
  # Detected from the EBML DocType when the bytes are WebM's.
  - mime_type: "video/x-matroska"
    extensions: [".mkv"]
    container: [audio, video]
  - mime_type: "audio/x-matroska"
    extensions: [".mka"]
  - mime_type: "audio/webm"
    extensions: [".weba"]
  - mime_type: "video/ogg"
    extensions: [".ogv"]
  - mime_type: "video/x-ms-wmv"
    extensions: [".wmv"]

# URLs ending in these raise: providers cannot take them as attachments by URL.
unsupported_url_extensions: [".csv", ".htm", ".html", ".md", ".txt", ".doc", ".docx", ".ppt", ".pptx", ".xls", ".xlsx"]
